# Self-contained on purpose.
#
# Every other package in the family calls the reusable workflows in
# sebastienrousseau/config, but this one cannot: those repositories depend on
# this package, so if this package's release pipeline depended on them the
# family could never be bootstrapped from scratch. The root of a dependency
# graph does not get to have dependencies.
#
# npm provenance also only works inside a supported CI provider, so publishing
# happens here and never from a developer machine.

name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate the release without publishing'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Verify the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install from the committed lockfile
        run: npm ci

      - name: Run the test suite
        run: npm test

      - name: Read the manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "releasing @sebastienrousseau/config-kit@${version}"

      - name: Tag matches the manifest version
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          normalised="${TAG#v}"
          if [ "${normalised}" != "${VERSION}" ]; then
            echo "::error::release tag ${TAG} does not match package.json version ${VERSION}"
            exit 1
          fi

      - name: This version is not already on the registry
        shell: bash
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@sebastienrousseau/config-kit@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::@sebastienrousseau/config-kit@${VERSION} is already published; bump the version"
            exit 1
          fi
          echo "@sebastienrousseau/config-kit@${VERSION} is free"

      - name: Generate an SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json

      - name: Attach the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  npmjs:
    name: Publish to npmjs
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for provenance
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # npm trusted publishing (OIDC) requires npm >= 11.5.1 on Node >= 22.14,
      # so this job pins 22 regardless of the package's supported floor.
      # package-manager-cache is off because a cached npm can shadow the version
      # OIDC needs.
      - name: Set up Node.js for npmjs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1, and the npm bundled with a Node
      # release lags well behind: Node 22 still ships npm 10, which has no OIDC
      # support at all and fails with "need auth". Pin the CLI explicitly rather
      # than inferring it from the Node version.
      - name: Ensure an npm that can do OIDC
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install from the committed lockfile
        run: npm ci

      - name: Publish (dry run)
        if: inputs.dry_run
        run: npm publish --access public --dry-run

      # With a trusted publisher configured for this package on npmjs.com, the
      # CLI authenticates over OIDC and attaches provenance on its own; the
      # token below is never used and the secret can be deleted. It stays only
      # so a package whose trusted publisher is not configured yet still
      # releases instead of failing.
      - name: Publish with SLSA provenance
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --provenance

  github-packages:
    name: Publish to GitHub Packages
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@sebastienrousseau'

      - name: Install from the committed lockfile
        run: npm ci

      - name: Publish (dry run)
        if: inputs.dry_run
        run: npm publish --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Re-running a release must not fail because GitHub Packages already has
      # the version. Only that specific conflict is tolerated; anything else
      # still fails the job.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if npm publish --access public 2>&1 | tee publish.log; then
            exit 0
          fi
          if grep -qE 'E409|[Cc]annot publish over' publish.log; then
            echo "::notice::already present on GitHub Packages; nothing to do"
            exit 0
          fi
          exit 1
